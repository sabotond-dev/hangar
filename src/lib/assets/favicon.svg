<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>HANGAR</title>
  <!-- The mark is the pad: a 9x9 lattice inside an outlined frame, with one
       lit diagonal running from the first cell to the centre. IDENT-01 as
       amended at the Phase 13 gate: square corners (D-01 covers any shape,
       not only CSS) and the Bible's two hexes - #101210 workspace, #dcff71
       action (D-16) - since 2026-09-12, batch row J.1 (D-23), plan 13-20.
       Before that, rx 6 / rx 5, a true-black plate and the retired Phase 4
       accent (D6FF4E, spelt out so no scan counts it as a colour).
       Copyright (C) 2026 Botond Sandor. Licensed under the GNU GPL v3 or later. -->
  <rect width="32" height="32" fill="#101210"/>
  <rect x="2" y="2" width="28" height="28" fill="none" stroke="#dcff71" stroke-width="1.5"/>
  <g fill="#dcff71" fill-opacity=".35">
    <circle cx="5" cy="5" r=".9"/><circle cx="7.75" cy="5" r=".9"/><circle cx="10.5" cy="5" r=".9"/><circle cx="13.25" cy="5" r=".9"/><circle cx="16" cy="5" r=".9"/><circle cx="18.75" cy="5" r=".9"/><circle cx="21.5" cy="5" r=".9"/><circle cx="24.25" cy="5" r=".9"/><circle cx="27" cy="5" r=".9"/>
    <circle cx="5" cy="7.75" r=".9"/><circle cx="7.75" cy="7.75" r=".9"/><circle cx="10.5" cy="7.75" r=".9"/><circle cx="13.25" cy="7.75" r=".9"/><circle cx="16" cy="7.75" r=".9"/><circle cx="18.75" cy="7.75" r=".9"/><circle cx="21.5" cy="7.75" r=".9"/><circle cx="24.25" cy="7.75" r=".9"/><circle cx="27" cy="7.75" r=".9"/>
    <circle cx="5" cy="10.5" r=".9"/><circle cx="7.75" cy="10.5" r=".9"/><circle cx="10.5" cy="10.5" r=".9"/><circle cx="13.25" cy="10.5" r=".9"/><circle cx="16" cy="10.5" r=".9"/><circle cx="18.75" cy="10.5" r=".9"/><circle cx="21.5" cy="10.5" r=".9"/><circle cx="24.25" cy="10.5" r=".9"/><circle cx="27" cy="10.5" r=".9"/>
    <circle cx="5" cy="13.25" r=".9"/><circle cx="7.75" cy="13.25" r=".9"/><circle cx="10.5" cy="13.25" r=".9"/><circle cx="13.25" cy="13.25" r=".9"/><circle cx="16" cy="13.25" r=".9"/><circle cx="18.75" cy="13.25" r=".9"/><circle cx="21.5" cy="13.25" r=".9"/><circle cx="24.25" cy="13.25" r=".9"/><circle cx="27" cy="13.25" r=".9"/>
    <circle cx="5" cy="16" r=".9"/><circle cx="7.75" cy="16" r=".9"/><circle cx="10.5" cy="16" r=".9"/><circle cx="13.25" cy="16" r=".9"/><circle cx="16" cy="16" r=".9"/><circle cx="18.75" cy="16" r=".9"/><circle cx="21.5" cy="16" r=".9"/><circle cx="24.25" cy="16" r=".9"/><circle cx="27" cy="16" r=".9"/>
    <circle cx="5" cy="18.75" r=".9"/><circle cx="7.75" cy="18.75" r=".9"/><circle cx="10.5" cy="18.75" r=".9"/><circle cx="13.25" cy="18.75" r=".9"/><circle cx="16" cy="18.75" r=".9"/><circle cx="18.75" cy="18.75" r=".9"/><circle cx="21.5" cy="18.75" r=".9"/><circle cx="24.25" cy="18.75" r=".9"/><circle cx="27" cy="18.75" r=".9"/>
    <circle cx="5" cy="21.5" r=".9"/><circle cx="7.75" cy="21.5" r=".9"/><circle cx="10.5" cy="21.5" r=".9"/><circle cx="13.25" cy="21.5" r=".9"/><circle cx="16" cy="21.5" r=".9"/><circle cx="18.75" cy="21.5" r=".9"/><circle cx="21.5" cy="21.5" r=".9"/><circle cx="24.25" cy="21.5" r=".9"/><circle cx="27" cy="21.5" r=".9"/>
